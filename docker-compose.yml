version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ride_recap_backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ride_recap_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL}

  # Database migrations (run once)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ride_recap_migrate
    env_file:
      - .env
    command: npx prisma migrate deploy
    volumes:
      - ./backend/prisma:/app/prisma
    restart: "no"

networks:
  default:
    driver: bridge