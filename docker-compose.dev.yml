version: '3.8'

services:
  # Backend API (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ride_recap_backend_dev
    env_file:
      - backend/.env
    environment:
      NODE_ENV: development
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    command: npm run dev

  # Frontend Web App (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ride_recap_frontend_dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: npm run dev

  # Database migrations (run once) - Development - Uses external cloud database
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ride_recap_migrate_dev
    env_file:
      - backend/.env
    command: npx prisma migrate deploy
    volumes:
      - ./backend/prisma:/app/prisma
    restart: "no"

volumes:
  # No local database volumes needed - using external cloud database

networks:
  default:
    driver: bridge
